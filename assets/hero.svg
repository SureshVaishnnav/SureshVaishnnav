  <g font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif">
    <animate attributeName="opacity" values="0;1" dur="1.6s" fill="freeze"/>
    <text x="60" y="92" font-size="15" font-weight="600" letter-spacing="6" fill="#00f0ff">HELLO WORLD, I AM</text>
    <rect x="262" y="80" width="9" height="15" fill="#00f0ff"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
    <text x="56" y="155" font-size="58" font-weight="800" fill="url(#txt)" filter="url(#glow)">Suresh Vaishnav</text>
    <text x="60" y="192" font-size="21" font-weight="600" fill="#e2e8f0">Senior Mobile · AI · Full-Stack Developer</text>
    <text x="60" y="224" font-family="Consolas,'Fira Code',monospace" font-size="14" fill="#c084fc">&lt;Android/&gt;  &lt;iOS/&gt;  &lt;Flutter/&gt;  &lt;ReactNative/&gt;  &lt;Next.js/&gt;</text>
