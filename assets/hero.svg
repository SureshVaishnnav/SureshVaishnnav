      <ellipse ry="90" rx="90"><animate attributeName="rx" values="90;0;90" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" dur="6s" begin="-1s" repeatCount="indefinite"/></ellipse>
      <ellipse ry="90" rx="90"><animate attributeName="rx" values="90;0;90" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" dur="6s" begin="-2s" repeatCount="indefinite"/></ellipse>
      <ellipse ry="90" rx="90" stroke="#ff2bd6"><animate attributeName="rx" values="90;0;90" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" dur="6s" begin="-3s" repeatCount="indefinite"/></ellipse>
      <ellipse ry="90" rx="90"><animate attributeName="rx" values="90;0;90" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" dur="6s" begin="-4s" repeatCount="indefinite"/></ellipse>
      <ellipse ry="90" rx="90"><animate attributeName="rx" values="90;0;90" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" dur="6s" begin="-5s" repeatCount="indefinite"/></ellipse>
    </g>
    <ellipse rx="175" ry="40" fill="none" stroke="#a855f7" stroke-width="1.2" stroke-dasharray="4 6" opacity="0.8"/>
    <g font-family="Consolas,'Fira Code',monospace" font-size="13" font-weight="700" fill="#ffffff">
      <g><circle r="5" fill="#3DDC84" filter="url(#glow)"/><text x="9" y="4">Kotlin</text><animateMotion dur="12s" begin="0s" repeatCount="indefinite"><mpath href="#orbit"/></animateMotion></g>
      <g><circle r="5" fill="#F05138" filter="url(#glow)"/><text x="9" y="4">Swift</text><animateMotion dur="12s" begin="-2.4s" repeatCount="indefinite"><mpath href="#orbit"/></animateMotion></g>
      <g><circle r="5" fill="#02B5F5" filter="url(#glow)"/><text x="9" y="4">Flutter</text><animateMotion dur="12s" begin="-4.8s" repeatCount="indefinite"><mpath href="#orbit"/></animateMotion></g>
      <g><circle r="5" fill="#ff2bd6" filter="url(#glow)"/><text x="9" y="4">AI</text><animateMotion dur="12s" begin="-7.2s" repeatCount="indefinite"><mpath href="#orbit"/></animateMotion></g>
      <g><circle r="5" fill="#ffffff" filter="url(#glow)"/><text x="9" y="4">Next.js</text><animateMotion dur="12s" begin="-9.6s" repeatCount="indefinite"><mpath href="#orbit"/></animateMotion></g>
    </g>
