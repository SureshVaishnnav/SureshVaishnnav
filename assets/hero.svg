    <line x1="500" y1="250" x2="-900" y2="340"/><line x1="500" y1="250" x2="-600" y2="340"/><line x1="500" y1="250" x2="-300" y2="340"/><line x1="500" y1="250" x2="0" y2="340"/><line x1="500" y1="250" x2="250" y2="340"/><line x1="500" y1="250" x2="500" y2="340"/><line x1="500" y1="250" x2="750" y2="340"/><line x1="500" y1="250" x2="1000" y2="340"/><line x1="500" y1="250" x2="1300" y2="340"/><line x1="500" y1="250" x2="1600" y2="340"/><line x1="500" y1="250" x2="1900" y2="340"/>
    <line x1="0" x2="1000" y1="250" y2="250"><animate attributeName="y1" values="250;340" keyTimes="0;1" calcMode="spline" keySplines="0.6 0 1 1" dur="4s" begin="0s" repeatCount="indefinite"/><animate attributeName="y2" values="250;340" keyTimes="0;1" calcMode="spline" keySplines="0.6 0 1 1" dur="4s" begin="0s" repeatCount="indefinite"/></line>
    <line x1="0" x2="1000" y1="250" y2="250"><animate attributeName="y1" values="250;340" keyTimes="0;1" calcMode="spline" keySplines="0.6 0 1 1" dur="4s" begin="-0.8s" repeatCount="indefinite"/><animate attributeName="y2" values="250;340" keyTimes="0;1" calcMode="spline" keySplines="0.6 0 1 1" dur="4s" begin="-0.8s" repeatCount="indefinite"/></line>
    <line x1="0" x2="1000" y1="250" y2="250"><animate attributeName="y1" values="250;340" keyTimes="0;1" calcMode="spline" keySplines="0.6 0 1 1" dur="4s" begin="-1.6s" repeatCount="indefinite"/><animate attributeName="y2" values="250;340" keyTimes="0;1" calcMode="spline" keySplines="0.6 0 1 1" dur="4s" begin="-1.6s" repeatCount="indefinite"/></line>
    <line x1="0" x2="1000" y1="250" y2="250"><animate attributeName="y1" values="250;340" keyTimes="0;1" calcMode="spline" keySplines="0.6 0 1 1" dur="4s" begin="-2.4s" repeatCount="indefinite"/><animate attributeName="y2" values="250;340" keyTimes="0;1" calcMode="spline" keySplines="0.6 0 1 1" dur="4s" begin="-2.4s" repeatCount="indefinite"/></line>
    <line x1="0" x2="1000" y1="250" y2="250"><animate attributeName="y1" values="250;340" keyTimes="0;1" calcMode="spline" keySplines="0.6 0 1 1" dur="4s" begin="-3.2s" repeatCount="indefinite"/><animate attributeName="y2" values="250;340" keyTimes="0;1" calcMode="spline" keySplines="0.6 0 1 1" dur="4s" begin="-3.2s" repeatCount="indefinite"/></line>
