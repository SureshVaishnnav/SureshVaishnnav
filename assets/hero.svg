<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05010f"/>
      <stop offset="0.65" stop-color="#0d0b2b"/>
      <stop offset="1" stop-color="#1d0b42"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="0.5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#ff2bd6"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;1 0;0 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.45"/>
      <stop offset="0.6" stop-color="#ff2bd6" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ff2bd6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floor" gradientUnits="userSpaceOnUse" x1="0" y1="250" x2="0" y2="340">
      <stop offset="0" stop-color="#ff2bd6" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#ff2bd6" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="floorClip"><rect x="0" y="250" width="1000" height="90"/></clipPath>
    <path id="orbit" d="M -175 0 A 175 40 0 1 0 175 0 A 175 40 0 1 0 -175 0"/>
  </defs>
  <rect width="1000" height="340" fill="url(#bg)"/>
